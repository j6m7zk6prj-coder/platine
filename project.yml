# Décrit le projet Xcode. GitHub le transforme en projet Xcode avec XcodeGen avant de compiler.
name: Platine
options:
  bundleIdPrefix: com.platine
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Platine:
    type: application
    platform: iOS
    sources:
      - path: Platine
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Platine
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSPhotoLibraryAddUsageDescription: "Platine enregistre les pochettes que tu choisis dans tes Photos."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.platine.player
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
