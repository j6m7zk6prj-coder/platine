name: Test envoi Wi-Fi

on:
  push:
    branches: [platine-9]
    paths: [WifiServer.swift, ServerTest/**, TrackEnricher.swift, Lyrics.swift, EnrichTest/**, .github/workflows/server-test.yml]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compiler et tester le serveur
        run: |
          swiftc -O WifiServer.swift ServerTest/main.swift -o wifi-test-bin
          ./wifi-test-bin
      - name: Tester la recherche d'album et de paroles
        run: |
          swiftc -O Lyrics.swift TrackEnricher.swift EnrichTest/main.swift -o enrich-test-bin
          ./enrich-test-bin
      - name: Diagnostic catalogue
        if: always()
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" "https://itunes.apple.com/search?term=Werenoi%20C63&media=music&entity=song&limit=5&country=FR"
          curl -s "https://itunes.apple.com/search?term=Werenoi%20C63&media=music&entity=song&limit=5&country=FR" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(r.get('trackName'),'|',r.get('artistName'),'|',r.get('collectionName'),'|',r.get('trackCount'),r.get('trackTimeMillis')) for r in d['results']]"
          curl -s "https://itunes.apple.com/search?term=13%20Organis%C3%A9%20Bande%20organis%C3%A9e&media=music&entity=song&limit=5&country=FR" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(r.get('trackName'),'|',r.get('artistName'),'|',r.get('collectionName'),'|',r.get('trackCount'),r.get('trackTimeMillis')) for r in d['results']]"
