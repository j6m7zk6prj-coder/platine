name: Dessiner les icônes

on:
  push:
    branches: [platine-9]
    paths: [tools/icons.py, .github/workflows/icons.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Dessiner avec l'écriture manuscrite du Mac
        run: |
          python3 -m pip install --quiet --break-system-packages pillow numpy || python3 -m pip install --quiet pillow numpy
          F=""
          for f in "/System/Library/Fonts/Supplemental/SnellRoundhand.ttc" "/System/Library/Fonts/Supplemental/Apple Chancery.ttf" "/System/Library/Fonts/Supplemental/Zapfino.ttf"; do
            if [ -f "$f" ]; then F="$f"; break; fi
          done
          echo "Police : $F"
          python3 tools/icons.py . "$F"
      - name: Enregistrer les icônes dans le projet
        run: |
          git config user.name "j6m7zk6prj-coder"
          git config user.email "j6m7zk6prj-coder@users.noreply.github.com"
          git add icon*.png
          git commit -m "Icônes dessinées (platine, écriture manuscrite)" || echo "rien à changer"
          git push
